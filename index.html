<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Link Box - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    
    <style>
        :root {
            --primary: #6c5ce7; --bg: #0a0a0f; --card: #16162a;
            --text: #e8e8f0; --muted: #a0a0b8; --border: #2a2a4a;
            --danger: #ff4757; --success: #2ed573;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .hidden { display: none !important; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Modal Style */
        #imgModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
        #imgModal img { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }
        .close-modal { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }

        header { background: var(--card); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .admin-badge { background: rgba(108, 92, 231, 0.2); color: #a29bfe; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .stat-box { background: linear-gradient(135deg, var(--card) 0%, #1a1a30 100%); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; gap: 15px; margin: 20px 0; border-bottom: 1px solid var(--border); }
        .tab { padding: 12px 20px; cursor: pointer; color: var(--muted); font-weight: 500; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .form-card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .form-row { margin-bottom: 15px; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 12px; background: #1a1a30; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; box-sizing: border-box; }
        
        .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .report-card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .badge-reason { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--primary); color: white; }
        .actions { margin-top: auto; display: flex; gap: 10px; border-top: 1px solid var(--border); padding-top: 15px; }
        
        /* Red box for gap info */
        .gap-box { background: rgba(255, 71, 87, 0.15); color: #ff4757; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 71, 87, 0.3); font-weight: 600; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }

        #loadingOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #1a1a30; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .toast { background: var(--card); border-left: 4px solid var(--primary); color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="imgModal" onclick="this.style.display='none'">
        <span class="close-modal">&times;</span>
        <img id="modalImg" src="">
    </div>

    <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Processing...</p>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <div id="loginScreen" class="hidden">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
            <div class="login-box" style="background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center;">
                <i class="fas fa-shield-alt" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2>Admin Login</h2>
                <form id="loginForm">
                    <div class="input-group" style="margin-bottom: 20px;"><input type="email" id="loginEmail" placeholder="Admin Email" style="width: 100%; padding: 12px; background: #1a1a30; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; box-sizing: border-box;" required></div>
                    <div class="input-group" style="margin-bottom: 20px;"><input type="password" id="loginPass" placeholder="Password" style="width: 100%; padding: 12px; background: #1a1a30; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; box-sizing: border-box;" required></div>
                    <p id="loginError" style="color: var(--danger); font-size: 13px; margin-bottom: 15px;"></p>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-link" style="color: var(--primary);"></i>
                <h3 style="margin: 0;">Link Box Admin</h3>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="adminBadge" class="admin-badge"></span>
                <button id="logoutBtn" class="btn" style="background: rgba(239, 68, 68, 0.1); color: var(--danger);">Logout</button>
            </div>
        </header>

        <div class="container">
            <div class="stat-box">
                <div>
                    <div style="color: var(--muted); font-size: 12px; text-transform: uppercase;">Active Reports</div>
                    <div id="activeCount" style="font-size: 28px; font-weight: 800; color: var(--primary);">0</div>
                </div>
                <i class="fas fa-file-invoice" style="font-size: 30px; opacity: 0.2;"></i>
            </div>

            <div class="tabs">
                <div class="tab active" id="t-submit" onclick="switchTab('submit')">Submit</div>
                <div class="tab" id="t-active" onclick="switchTab('active')">Active List</div>
                <div class="tab" id="t-dismissed" onclick="switchTab('dismissed')">History</div>
            </div>

            <div id="tabSubmit" class="tab-content">
                <div class="form-card">
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button id="btnTypeSingle" class="btn btn-primary" onclick="toggleFormType('single')">Single</button>
                        <button id="btnTypeMulti" class="btn" style="background: #1a1a30; color: var(--muted);" onclick="toggleFormType('multi')">Multiple</button>
                    </div>

                    <div id="singleForm">
                        <div class="form-row"><label style="font-size:12px; color:var(--muted)">Report Date & Time</label><input type="datetime-local" id="sDate"></div>
                        <div class="form-row"><input type="text" id="sName" placeholder="Member Name"></div>
                        <div class="form-row">
                            <select id="sReason">
                                <option value="">Reason...</option>
                                <option>Support incomplete</option>
                                <option>Support Gap</option>
                                <option>Sticker / Emoji / NC</option>
                                <option>18+/Political post</option>
                                <option>Others</option>
                            </select>
                        </div>
                        <div class="form-row"><textarea id="sDesc" placeholder="Description (Optional)"></textarea></div>
                        <div class="form-row"><input type="file" id="sFile" accept="image/*"></div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="submitSingle()">Submit Report</button>
                    </div>

                    <div id="multiForm" class="hidden">
                        <div class="form-row"><label style="font-size:12px; color:var(--muted)">Reports Date & Time</label><input type="datetime-local" id="mDate"></div>
                        <div class="form-row">
                            <select id="mReason">
                                <option value="">Multiple  Reason...</option>
                                <option>Support Incomplete</option>
                                <option>Support Gap</option>
                                <option>Sticker / Emoji / NC</option>
                            </select>
                        </div>
                        <div class="form-row"><textarea id="mList" rows="8" placeholder="Paste full list with @usernames here..."></textarea></div>
                        <div class="form-row"><input type="file" id="mFile" accept="image/*"></div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="submitMulti()">Submit All Reports</button>
                    </div>
                </div>
            </div>

            <div id="tabActive" class="tab-content hidden">
                <input type="text" id="searchBox" placeholder="Search by name..." onkeyup="renderReports()" class="form-row" style="margin-bottom: 20px;">
                <div id="activeList" class="report-grid"></div>
            </div>

            <div id="tabDismissed" class="tab-content hidden">
                <div id="dismissedList" class="report-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xzgozwylnfpcicdipjhw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_mjndYPAxtmjjulEtV3brkA_CPhU4BA_";
        const IMGBB_API_KEY = "18269b500c7f745cd899da9cdad1bc50";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_NAMES = {
            'shihab@linkbox.com': 'Md Shihab Khan',
            'mamun@linkbox.com': 'Mamun Aravi',
            'shuvo@linkbox.com': 'Shuvo Sutradhar',
            'shadat@linkbox.com': 'ShaDat Hossain',
            'rubel@linkbox.com': 'Ariyan Ahmed Rubel',
            'mustakim@linkbox.com': 'MD Mustakim Islam',
            'hanif@linkbox.com': 'Mohammad Abu Hanif'
        };

        let currentUser = null;
        let allReports = [];

        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imgModal').style.display = 'flex';
        }

        function setDefaultDate() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const dateStr = now.toISOString().slice(0, 16);
            document.getElementById('sDate').value = dateStr;
            document.getElementById('mDate').value = dateStr;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setDefaultDate();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && ADMIN_NAMES[session.user.email.toLowerCase()]) {
                loginSuccess(session.user.email);
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.toLowerCase();
            const pass = document.getElementById('loginPass').value;
            toggleLoading(true);
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
            toggleLoading(false);
            if (error) document.getElementById('loginError').innerText = "Wrong Email or Password";
            else if (!ADMIN_NAMES[email]) {
                document.getElementById('loginError').innerText = "Access Denied!";
                await supabaseClient.auth.signOut();
            } else loginSuccess(email);
        });

        function loginSuccess(email) {
            currentUser = { email, name: ADMIN_NAMES[email.toLowerCase()] };
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('adminBadge').innerText = currentUser.name;
            loadReports();
            supabaseClient.channel('public:reports').on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, () => loadReports()).subscribe();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.reload();
        });

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(c => c.classList.remove('active'));
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('hidden');
            document.getElementById('t-' + t).classList.add('active');
        }

        function toggleFormType(type) {
            document.getElementById('singleForm').classList.toggle('hidden', type !== 'single');
            document.getElementById('multiForm').classList.toggle('hidden', type !== 'multi');
            document.getElementById('btnTypeSingle').classList.toggle('btn-primary', type === 'single');
            document.getElementById('btnTypeMulti').classList.toggle('btn-primary', type === 'multi');
        }

        async function uploadToImgBB(inputId) {
            const files = document.getElementById(inputId).files;
            if (!files.length) return [];
            const urls = [];
            for (let f of files) {
                const fd = new FormData();
                fd.append("image", f);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: fd });
                    const d = await res.json();
                    if (d.success) urls.push(d.data.url);
                } catch (e) { console.error(e); }
            }
            return urls;
        }

        async function submitSingle() {
            const name = document.getElementById('sName').value;
            const reason = document.getElementById('sReason').value;
            const desc = document.getElementById('sDesc').value;
            const date = document.getElementById('sDate').value;
            if (!name || !reason) return showToast('Fill Name and Reason!', 'error');
            toggleLoading(true);
            const imgs = await uploadToImgBB('sFile');
            const { error } = await supabaseClient.from('reports').insert({
                name, reason, description: desc,
                screenshots: imgs, admin_name: currentUser.name, created_at: new Date(date).toISOString()
            });
            toggleLoading(false);
            if (error) showToast(error.message, 'error');
            else { showToast('Report Saved!'); document.getElementById('sName').value = ''; document.getElementById('sDesc').value = ''; setDefaultDate(); }
        }

        async function submitMulti() {
            const text = document.getElementById('mList').value;
            const reason = document.getElementById('mReason').value;
            const date = document.getElementById('mDate').value;
            if (!text || !reason) return showToast('Select Reason and Paste List!', 'error');
            toggleLoading(true);
            const imgs = await uploadToImgBB('mFile');
            const lines = text.split('\n');
            const rows = [];
            
            lines.forEach(line => {
                // regex logic to split name and gap info
                const match = line.match(/@(.+?)(সাপোর্ট গ্যাপ.*)/);
                if (match) {
                    let mName = match[1].trim();
                    let extraInfo = match[2].trim();
                    rows.push({
                        name: mName, reason, screenshots: imgs,
                        admin_name: currentUser.name, link_number: extraInfo, created_at: new Date(date).toISOString()
                    });
                } else {
                    // fall back for lines without "সাপোর্ট গ্যাপ" keyword
                    const simpleMatch = line.match(/@([^📌\n ]+)(.*)/);
                    if (simpleMatch) {
                        rows.push({
                            name: simpleMatch[1].trim(), reason, screenshots: imgs,
                            admin_name: currentUser.name, link_number: simpleMatch[2].trim(), created_at: new Date(date).toISOString()
                        });
                    }
                }
            });
            
            if (!rows.length) { toggleLoading(false); return showToast('No @usernames found!', 'error'); }
            const { error } = await supabaseClient.from('reports').insert(rows);
            toggleLoading(false);
            if (error) showToast(error.message, 'error');
            else { showToast(rows.length + ' Reports Saved!'); document.getElementById('mList').value = ''; setDefaultDate(); }
        }

        async function loadReports() {
            const { data } = await supabaseClient.from('reports').select('*').order('created_at', { ascending: false });
            if (data) { allReports = data; renderReports(); }
        }

        function renderReports() {
            const q = document.getElementById('searchBox').value.toLowerCase();
            const act = document.getElementById('activeList');
            const dis = document.getElementById('dismissedList');
            let activeCount = 0;
            act.innerHTML = ''; dis.innerHTML = '';

            allReports.forEach(r => {
                if (!r.dismissed) activeCount++;
                if (q && !r.name.toLowerCase().includes(q)) return;

                const card = document.createElement('div');
                card.className = 'report-card';
                
                let imgHtml = '';
                if (r.screenshots && r.screenshots.length > 0) {
                    imgHtml = `
                    <div style="margin-top:5px;">
                        <img src="${r.screenshots[0]}" onclick="openModal('${r.screenshots[0]}')" style="width:100%; max-height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer;">
                    </div>`;
                }

                let descHtml = r.description ? `<p style="margin:5px 0; padding:8px; background:rgba(255,255,255,0.03); border-radius:6px; font-size:12px; border-left:2px solid var(--primary); color:#ddd; font-style:italic;">"${r.description}"</p>` : '';

                // Detect if it's a "সাপোর্ট গ্যাপ" type to show red box
                let infoHtml = '';
                if (r.link_number && r.link_number.includes('সাপোর্ট গ্যাপ')) {
                    infoHtml = `<div class="gap-box">${r.link_number}</div>`;
                } else if (r.link_number) {
                    infoHtml = `<div style="color:#f1c40f; margin-bottom:8px; font-weight:500; font-size:13px;">${r.link_number}</div>`;
                }

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span style="font-weight:700; color:white; font-size:17px; line-height:1.3; flex: 1; margin-right: 10px;">${r.name}</span>
                        <span class="badge-reason">${r.reason}</span>
                    </div>
                    
                    <div style="background:rgba(0,0,0,0.25); padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
                        ${infoHtml}
                        ${descHtml}
                        <div style="display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:11px; margin-top:5px;">
                            <span><i class="fas fa-user-shield" style="width:16px;"></i> ${r.admin_name}</span>
                            <span><i class="fas fa-calendar-alt" style="width:16px;"></i> ${new Date(r.created_at).toLocaleString('bn-BD')}</span>
                        </div>
                        ${imgHtml}
                    </div>

                    <div class="actions">
                        <button class="btn" style="flex:1; background:#1a1a30; color:var(--success)" onclick="updateStatus(${r.id}, ${!r.dismissed})">${r.dismissed ? 'Restore' : 'Dismiss'}</button>
                        <button class="btn" style="background:rgba(255, 71, 87, 0.1); color:var(--danger)" onclick="deleteRep(${r.id})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                if (r.dismissed) dis.appendChild(card); else act.appendChild(card);
            });
            document.getElementById('activeCount').innerText = activeCount;
        }

        async function updateStatus(id, stat) { await supabaseClient.from('reports').update({ dismissed: stat }).eq('id', id); showToast(stat ? 'Moved to History' : 'Restored'); }
        async function deleteRep(id) { if (confirm('Delete Permanently?')) { await supabaseClient.from('reports').delete().eq('id', id); showToast('Deleted'); } }
        function toggleLoading(s) { document.getElementById('loadingOverlay').classList.toggle('hidden', !s); }
        function showToast(m, type) { const t = document.createElement('div'); t.className = 'toast'; if(type === 'error') t.style.borderLeftColor = 'var(--danger)'; t.innerText = m; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 3000); }
    </script>
</body>
    </html>
